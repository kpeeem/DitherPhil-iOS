name: DitherPhil
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  DitherPhil:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Dither.ci.metal
      - path: App/Dither.ci.metal
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kpem.ditherphil.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save your rendered photos and videos to Photos.
        INFOPLIST_KEY_CFBundleDisplayName: DitherPhil
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - target: DitherPhilShare
        embed: true
    postBuildScripts: &metalBuild
      - name: Build Core Image Metal library
        inputFiles:
          - $(SRCROOT)/App/Dither.ci.metal
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Dither.metallib
        script: |
          set -eu
          cd "$SRCROOT"
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          xcrun --sdk "$PLATFORM_NAME" metal -fcikernel -x metal -c - -o "$TARGET_TEMP_DIR/Dither.air" < App/Dither.ci.metal
          xcrun --sdk "$PLATFORM_NAME" metallib -cikernel "$TARGET_TEMP_DIR/Dither.air" -o "$SCRIPT_OUTPUT_FILE_0"
  DitherPhilShare:
    type: app-extension
    platform: iOS
    sources:
      - path: App
        excludes: [DitherPhilApp.swift, DitherShortcuts.swift, Dither.ci.metal]
      - path: Share
        excludes: [Info.plist]
    info:
      path: Share/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: DitherPhil
        NSPhotoLibraryAddUsageDescription: Save your rendered photos and videos to Photos.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kpem.ditherphil.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts: *metalBuild
  DitherPhilTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DitherPhil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kpem.ditherphil.tests
        GENERATE_INFOPLIST_FILE: YES
  DitherPhilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DitherPhil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kpem.ditherphil.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DitherPhil:
    build:
      targets:
        DitherPhil: all
    test:
      targets: [DitherPhilTests, DitherPhilUITests]
